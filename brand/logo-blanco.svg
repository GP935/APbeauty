  <line x1="2" y1="48" x2="72" y2="6" stroke="#C8102E" stroke-width="4" stroke-linecap="round"/>
  <text x="80" y="26" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#FFFFFF">BEAUTY</text>
  <text x="81" y="44" font-family="Montserrat, Arial, sans-serif" font-size="8.5" letter-spacing="3" fill="#B5B5B5">CONTROLLED PRESENCE</text>
