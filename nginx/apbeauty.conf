# ─────────────────────────────────────────────────────────────
# AP Beauty · Nginx (VPS detrás de Cloudflare)
# Redactado por backend · REVISADO Y ADOPTADO por devops 2026-07-15.
# Actualizado devops 2026-09-05: moneda única PEN, pasarela viva = Mercado
# Pago producción (Stripe dormido). Sin ruteo geográfico.
#
# Arquitectura: Cloudflare (SSL/CDN/proxy) → Nginx (este VPS) →
#   · estático (index.html, carrito.html, ...) servido por Nginx
#   · /api/*  →  proxy a Node (PM2) en 127.0.0.1:3000  (incluye /api/mp/*)
# Mismo origen → sin CORS.
#
# Coloca en /etc/nginx/sites-available/apbeauty.conf y symlink a sites-enabled/.
# Ajusta rutas y dominio antes de usar.
# ─────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS (Cloudflare ya fuerza HTTPS al cliente; esto cubre
# accesos directos al origen).
server {
    listen 80;
    listen [::]:80;
    server_name apbeauty-lima.com www.apbeauty-lima.com;

    # Renovaciones certbot (http-01) — servir el challenge antes del redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/apbeauty;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apbeauty-lima.com www.apbeauty-lima.com;

    # Certificado del origen. Opciones:
    #  a) Let's Encrypt (certbot):
    ssl_certificate     /etc/letsencrypt/live/apbeauty-lima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apbeauty-lima.com/privkey.pem;
    #  b) Cloudflare Origin Certificate (recomendado con SSL "Full (strict)").
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Raíz = repo clonado. OJO: hay que BLOQUEAR server/, .git y dotfiles
    # para no exponer .env / código de servidor (ver denies abajo).
    root /var/www/apbeauty;
    index index.html;

    # ── IP real del visitante detrás de Cloudflare (para logs / rate-limit) ──
    # (cf-ipcountry ya no se usa para ruteo — negocio solo Perú, moneda única PEN.)
    # Descomenta e incluye el snippet con los rangos de Cloudflare + real_ip:
    #   include /etc/nginx/cloudflare-realip.conf;   # set_real_ip_from <rangos CF>;
    #   real_ip_header CF-Connecting-IP;

    # ── Cabeceras de seguridad ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP — orígenes del frontend (base 2026-07-15) + Mercado Pago Brick.
    #   scripts propios: main.js local + los JSON-LD de SEO (no ejecutables).
    #   estilos/fuentes: Google Fonts (Playfair Display + Montserrat).
    #
    #   PASARELA VIVA = Mercado Pago. El Card Payment Brick va EMBEBIDO
    #   (requisito de producto: sin redirect a mercadopago.com).
    #
    #   ✅ VERIFICADO CON CLIC REAL 2026-09-06 por devops (Chrome + proxy local
    #   que replica ESTA cabecera contra el backend de producción). Con la CSP
    #   anterior el Brick fallaba ("Bricks.create: component initialization
    #   failed", contenedor vacío) — checkout roto. Violaciones capturadas por
    #   `securitypolicyviolation` y corregidas una a una:
    #     · script-src-elem  http2.mlstatic.com/.../op-cho-bricks/.../cardPayment.js
    #       → el Brick carga su código de componente desde *.mlstatic.com (NO solo
    #         sdk.mercadopago.com). Era EL bloqueante que impedía renderizar.
    #     · script-src-elem  'inline'  → el SDK de MP inyecta <script> inline.
    #       Bricks embebido NO soporta nonce/hash en hosting estático → obliga a
    #       'unsafe-inline' en script-src (tradeoff aceptado; la alternativa es
    #       Checkout Pro por redirect, descartada por producto).
    #     · connect-src  www.mercadopago.com · events.mercadopago.com ·
    #       *.mercadolibre.com/tracks  → init + telemetría del SDK.
    #     · img-src  www.mercadolibre.com · www.mercadolivre.com  → píxeles de
    #       tracking del SDK (el .com/.livre son la misma empresa, ML BR).
    #   Resultado final: Brick renderiza completo (12 iframes de secure fields,
    #   campo DNI incluido), **0 CSP violations** ni en el auto-init de main.js
    #   ni en un re-mount manual. Si MP añade subdominios y algo se rompe,
    #   volver a capturar con `securitypolicyviolation` y ampliar.
    #
    #   Stripe DORMIDO. Si se reactiva embebido, añadir:
    #   script-src https://js.stripe.com · frame-src https://js.stripe.com
    #   https://checkout.stripe.com · connect-src https://api.stripe.com
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.mlstatic.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mercadolivre.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.mlstatic.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://sdk.mercadopago.com https://*.mlstatic.com https://*.mercadopago.com; connect-src 'self' https://*.mercadopago.com https://*.mercadolibre.com https://*.mercadolivre.com https://*.mlstatic.com; frame-src https://*.mercadopago.com https://*.mercadolibre.com; object-src 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # ── Bloquear rutas sensibles del repo ──
    location ^~ /server/  { deny all; return 404; }
    location ^~ /.git/    { deny all; return 404; }
    location ~ /\.        { deny all; return 404; }   # dotfiles (.env, etc.)

    # ── Healthcheck (Node /health) para monitor externo/uptime ──
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # ── API → Node (PM2) ──
    # Prefijo único: cubre /api/create-checkout-session, /api/market y TODAS
    # las subrutas /api/mp/* (create-order, process-payment, webhook). No hay
    # ningún `location` más específico que las excluya. NO añadir aquí
    # limit_req ni auth_basic: el webhook de Mercado Pago
    # (POST /api/mp/webhook?data.id=...&type=payment) llega desde las IPs de MP
    # y debe pasar sin fricción — la firma HMAC (x-signature) la valida Node.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El webhook de Stripe (si se reactiva) necesita el body intacto: NO
        # desactivar el request buffering ni reescribir el cuerpo. El de MP usa
        # headers + query + JSON parseado (no raw body). Nginx lo pasa bien por
        # defecto; preservar la query string (proxy_pass sin URI la conserva).
        proxy_read_timeout 30s;
    }

    # ── Estático (SPA-friendly fallback a index para rutas sin extensión) ──
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
