# ─────────────────────────────────────────────────────────────
# AP Beauty · Nginx (VPS detrás de Cloudflare)
# Redactado por backend · REVISADO Y ADOPTADO por devops 2026-07-15.
#
# Arquitectura: Cloudflare (SSL/CDN/proxy) → Nginx (este VPS) →
#   · estático (index.html, carrito.html, ...) servido por Nginx
#   · /api/*  →  proxy a Node (PM2) en 127.0.0.1:3000
# Mismo origen → sin CORS.
#
# Coloca en /etc/nginx/sites-available/apbeauty.conf y symlink a sites-enabled/.
# Ajusta rutas y dominio antes de usar.
# ─────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS (Cloudflare ya fuerza HTTPS al cliente; esto cubre
# accesos directos al origen).
server {
    listen 80;
    listen [::]:80;
    server_name apbeauty.com www.apbeauty.com;

    # Renovaciones certbot (http-01) — servir el challenge antes del redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/apbeauty;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apbeauty.com www.apbeauty.com;

    # Certificado del origen. Opciones:
    #  a) Let's Encrypt (certbot):
    ssl_certificate     /etc/letsencrypt/live/apbeauty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apbeauty.com/privkey.pem;
    #  b) Cloudflare Origin Certificate (recomendado con SSL "Full (strict)").
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Raíz = repo clonado. OJO: hay que BLOQUEAR server/, .git y dotfiles
    # para no exponer .env / código de servidor (ver denies abajo).
    root /var/www/apbeauty;
    index index.html;

    # ── IP real del visitante detrás de Cloudflare (para logs / cf-ipcountry) ──
    # Descomenta e incluye el snippet con los rangos de Cloudflare + real_ip:
    #   include /etc/nginx/cloudflare-realip.conf;   # set_real_ip_from <rangos CF>;
    #   real_ip_header CF-Connecting-IP;

    # ── Cabeceras de seguridad ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP ajustada a los orígenes REALES del frontend (verificado 2026-07-15):
    #   scripts: solo main.js local (sin CDNs, sin inline ejecutable; los JSON-LD
    #   de SEO no se ejecutan y no los afecta la CSP).
    #   estilos/fuentes: Google Fonts (Playfair Display + Montserrat).
    #   checkout: Stripe HOSTED por redirect → no hace falta js.stripe.com ni
    #   frame-src. Si algún día se EMBEBE Stripe.js, añadir:
    #   script-src https://js.stripe.com · frame-src https://js.stripe.com
    #   https://checkout.stripe.com · connect-src https://api.stripe.com
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # ── Bloquear rutas sensibles del repo ──
    location ^~ /server/  { deny all; return 404; }
    location ^~ /.git/    { deny all; return 404; }
    location ~ /\.        { deny all; return 404; }   # dotfiles (.env, etc.)

    # ── Healthcheck (Node /health) para monitor externo/uptime ──
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # ── API → Node (PM2) ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reenvía el país de Cloudflare para el geo-ruteo (Fase 2):
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;
        # El webhook de Stripe necesita el body intacto: NO desactivar el
        # request buffering ni reescribir el cuerpo. Por defecto Nginx lo pasa bien.
        proxy_read_timeout 30s;
    }

    # ── Estático (SPA-friendly fallback a index para rutas sin extensión) ──
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
